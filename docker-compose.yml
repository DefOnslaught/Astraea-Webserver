services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - ./backend/.env
    environment:
      MYSQL_DATABASE: ${DB_NAME:-astraea_db}
      MYSQL_USER: ${DB_USER:-astraea_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secretpassword}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secretpassword}
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: 
      context: .
      dockerfile: docker/Dockerfile
    image: astraea-app:latest
    command: web
    restart: unless-stopped
    pid: "host" 
    volumes:
      - static_volume:/app/backend/staticfiles
      - frontend_volume:/app/frontend/dist
      - protected_storage:/app/protected_storage
      - /var/run/docker.sock:/var/run/docker.sock 
      - /proc:/host/proc:ro 
      - /sys:/host/sys:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /run/systemd/system:/run/systemd/system:ro
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_REDIS_URL=redis://redis:6379/1
      - PROCFS_PATH=/host/proc 
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/backend/staticfiles:ro
    depends_on:
      - web
  
  worker:
    image: astraea-app:latest
    command: worker
    restart: unless-stopped
    pid: "host"
    volumes:
      - protected_storage:/app/protected_storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /run/systemd/system:/run/systemd/system:ro
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_REDIS_URL=redis://redis:6379/1
      - PROCFS_PATH=/host/proc
    depends_on:
      - redis
      - db

  beat:
    image: astraea-app:latest 
    command: beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis
      - db

volumes:
  mysql_data:
  static_volume:
  frontend_volume:
  protected_storage: